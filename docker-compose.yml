services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      DATABASE_PATH: /data/conference.db
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8001"
    volumes:
      - conference_data:/data
    networks:
      - conference_network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80"
    networks:
      - conference_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  conference_network:
    driver: bridge

volumes:
  conference_data:
